<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Directory</title>
  <script src="./users.js" defer></script>
</head>
<body>
  <h1>User Directory</h1>
  <p>Load and search users from the JSONPlaceholder API.</p>

  <button id="load-users" type="button">Load Users</button>

  <p>
    <label for="filter-input">Filter users by name:</label>
    <input id="filter-input" type="text" placeholder="Enter a name">
  </p>

  <p id="status" role="status">Click "Load Users" to get started.</p>

  <ul id="users-list"></ul>
</body>
</html>
